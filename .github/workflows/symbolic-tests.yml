name: Symbolic learning checks

on:
  push:
    paths:
      - "projects/symbolic-machine-learning/**"
      - ".github/workflows/symbolic-tests.yml"
  pull_request:
    paths:
      - "projects/symbolic-machine-learning/**"
      - ".github/workflows/symbolic-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/symbolic-machine-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/symbolic-machine-learning/requirements.lock.txt
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Run guarded release, environment and learning checks
        run: python tools/run_checks.py --output-dir outputs/verification
      - name: Retain environment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-environment
          path: projects/symbolic-machine-learning/outputs/verification
